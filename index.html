<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veste Arte | Estampas e Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-neutral-50 text-zinc-900">

    <!-- Navegação -->
    <nav class="flex justify-between items-center p-6 md:px-12 bg-white border-b border-zinc-100 sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter uppercase italic">Veste<span class="text-orange-600">Arte</span></h1>
        <div class="flex gap-6 items-center">
            <span class="text-xs font-bold uppercase tracking-widest hidden md:block">Estampas Autorais</span>
            <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-orange-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <!-- Filtros -->
    <header class="py-12 px-6 text-center">
        <h2 class="text-4xl md:text-6xl font-bold mb-8 tracking-tighter">COLEÇÕES EM TELA</h2>
        <div id="filters" class="flex flex-wrap justify-center gap-4">
            <button data-filter="todos" class="filter-btn active bg-zinc-900 text-white px-6 py-2 rounded-full text-xs uppercase font-bold tracking-widest transition">Todos</button>
            <button data-filter="Abstrato" class="filter-btn border border-zinc-200 px-6 py-2 rounded-full text-xs uppercase font-bold tracking-widest hover:bg-zinc-100 transition">Abstrato</button>
            <button data-filter="Floral" class="filter-btn border border-zinc-200 px-6 py-2 rounded-full text-xs uppercase font-bold tracking-widest hover:bg-zinc-100 transition">Floral</button>
            <button data-filter="Geométrico" class="filter-btn border border-zinc-200 px-6 py-2 rounded-full text-xs uppercase font-bold tracking-widest hover:bg-zinc-100 transition">Geométrico</button>
        </div>
    </header>

    <!-- Grid de Produtos -->
    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Os produtos serão injetados via JS -->
        </div>
    </main>

    <footer class="bg-zinc-900 text-zinc-500 py-12 text-center text-xs uppercase tracking-[0.3em]">
        <p>© 2026 Veste Arte - Impressões com alma</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
